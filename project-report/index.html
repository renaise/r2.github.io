<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="origin">
<link rel="canonical" href="https://renaise.com/project-deck/">
<title>Project Deck · Renaise Kim</title>
<style>
  @font-face{font-family:Diatype;src:url(/fonts/Cargo-DiatypePlusVariable.woff2) format("woff2");font-weight:100 900;font-display:swap}
  :root{color-scheme:light dark;--paper:#ebebeb;--ink:#303030;--line:#777}
  @media(prefers-color-scheme:dark){:root{--paper:#161718;--ink:#dedede;--line:#9b9b9b}}
  *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font:1rem Diatype,system-ui,sans-serif}
  main{max-width:42rem;margin:0 auto;padding:2rem clamp(1rem,5vw,2rem)}
  nav{border-bottom:1px dotted var(--line);padding-bottom:1rem}
  h1{font:400 clamp(2.5rem,10vw,4.5rem)/1 "Times New Roman",serif;margin:2rem 0 1rem}
  p{line-height:1.5} a{color:inherit} label{display:block;margin:1.5rem 0 .5rem}
  .row{display:flex;flex-wrap:wrap;gap:.5rem} input,button{font:inherit;border:1px solid var(--line);padding:.65rem .8rem;color:var(--ink);background:transparent} input{flex:1;min-width:min(100%,12rem)} button{cursor:pointer} :focus-visible{outline:2px solid currentColor;outline-offset:3px}
</style>
</head>
<body>
<main>
  <nav aria-label="Portfolio"><a href="/">Renaise</a> / <a href="/work/">Public work</a></nav>
  <h1>Project Deck</h1>
  <p id="deck-help">This deck is private. Enter the password you received to view it.</p>
  <form method="post" action="https://renaise-deck-unlock.delicate-cloud-00a7.workers.dev/unlock" aria-describedby="deck-help">
    <label for="deck-password">Password</label>
    <div class="row">
      <input id="deck-password" name="password" type="password" autocomplete="current-password" maxlength="256" required>
      <button type="submit">Unlock deck</button>
    </div>
  </form>
</main>
</body>
</html>
